<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@1,500;1,600&display=swap">
<style>
/* World: a navigator's chart. Land (buff) rail, chart-water course field, magenta plotted course, black soundings for figures, fix marks at each course change. */
:root{
  --land:#ece2c4; --land-ink:#3d3622; --paper:#fdfdfb; --water:#d9eaf3; --water-deep:#b7d5e7; --contour:#9cc2d8;
  --ink:#121417; --muted:#4f5b66; --course:#c0187f; --fix-bad:#c73a2b; --fix-good:#23804a; --rule:#dfe4e8;
  --ui:'Barlow',system-ui,sans-serif; --chart:'Barlow Condensed','Barlow',sans-serif; --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font:16px/1.5 var(--ui);color:var(--ink);background:var(--paper);display:grid;grid-template-columns:196px minmax(0,1fr);font-variant-numeric:tabular-nums}
::selection{background:#f6c6e2;color:var(--ink)}
nav{background:var(--land);color:var(--land-ink);padding:22px 12px;display:flex;flex-direction:column;gap:1px;font-size:15px;position:sticky;top:0;height:100vh}
nav b{font:600 22px var(--ui);letter-spacing:.06em;color:var(--ink);padding:0 12px 20px}
nav button{all:unset;padding:7px 12px;border-radius:6px;cursor:pointer;transition:background-color 150ms var(--ease)}
nav button:hover{background:#e2d6b2}
nav button[aria-current]{background:var(--ink);color:var(--land)}
nav button:focus-visible{outline:2px solid var(--course);outline-offset:2px}
nav .gap{height:14px}
nav select{margin-top:auto;font:inherit;padding:8px;border-radius:6px;border:1px solid #cdbf98;background:#f4ecd6;color:var(--ink);cursor:pointer}
main{display:grid;grid-template-rows:auto auto 1fr;min-width:0}
.sea{background:var(--water);position:relative;padding:22px 40px 8px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;z-index:1}
.bar input{width:340px;max-width:100%;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--contour);border-radius:6px;background:var(--paper);caret-color:var(--course)}
.bar input:focus-visible{outline:2px solid var(--course);outline-offset:1px}
.bar span{font-size:14px;color:var(--muted)}
#head{position:relative;z-index:1;margin-top:26px;max-width:760px;transition:opacity 240ms var(--ease),filter 240ms var(--ease)}
#head.out,#read.out{opacity:0;filter:blur(4px)}
h1{font-size:38px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
#sub{margin-top:8px;color:#2c3a46;max-width:62ch}
.plot{position:relative;margin-top:6px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .wk{font:500 13px var(--ui);fill:var(--muted)}
.plot .nm{font:italic 600 17px var(--chart);fill:#1d3b52;letter-spacing:.01em}
#course{transition:stroke-dashoffset 800ms var(--ease)}
.fix{cursor:pointer}
.fix .hit{fill:transparent}
.fix .ring{fill:var(--water);stroke-width:2.5;transition:r 160ms var(--ease)}
.fix:hover .ring,.fix.on .ring{r:11}
.fix:focus{outline:none}
.fix:focus-visible .ring{stroke:var(--ink)}
.fix .nm{opacity:.45;transition:opacity 200ms var(--ease)}
.fix.on .nm,.fix.past .nm{opacity:1}
#read{position:absolute;background:var(--paper);border:1px solid var(--contour);border-radius:4px;padding:10px 14px;box-shadow:0 6px 18px rgba(29,59,82,.14);min-width:236px;transition:opacity 240ms var(--ease),filter 240ms var(--ease),left 500ms var(--ease),top 500ms var(--ease)}
#read div{display:flex;justify-content:space-between;gap:18px;font-size:14px;color:var(--muted)}
#read b{color:var(--ink);font-weight:600;font-size:16px}
#read s{color:var(--muted);font-weight:400;margin-right:6px;font-size:14px}
#read p{font:italic 600 15px var(--chart);color:var(--course);margin-bottom:4px}
.land{padding:26px 40px 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:48px}
h2{font-size:17px;font-weight:600;margin-bottom:4px}
ul{padding:0}
li{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-top:1px solid var(--rule)}
li span{font-weight:500}
li em{display:block;font-style:normal;color:var(--muted);font-size:14px;font-weight:400}
li.done span{color:var(--muted)}
.btn{font:500 15px var(--ui);padding:8px 16px;border-radius:6px;border:1px solid #c9d1d8;background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform 140ms var(--ease),background-color 150ms var(--ease)}
.btn:hover{background:#f1f4f6}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--course);outline-offset:2px}
.btn.go{background:var(--course);border-color:var(--course);color:#fff}
.btn.go:hover{background:#a5136c}
.btn.ok{background:#e4f2ea;border-color:#b5dcc4;color:var(--fix-good)}
.src li{display:block;font-size:15px;padding:10px 0}
.src li b{font-weight:600}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;display:flex;gap:16px;transition:opacity 220ms var(--ease),transform 220ms var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{all:unset;color:#f6a6d4;cursor:pointer;font-weight:600}
@media (max-width:900px){body{grid-template-columns:1fr}nav{display:none}.sea{padding:18px 16px 8px}.land{grid-template-columns:1fr;padding:22px 16px 40px;gap:28px}h1{font-size:28px}#read{position:static;margin:8px 0 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav aria-label="Workspaces">
  <b>ONE</b>
  <button aria-current="page">Overview</button><button>Action Center</button>
  <div class="gap"></div><button>Discovery</button><button>ICPs</button><button>Signals</button><button>Accounts</button>
  <div class="gap"></div><button>Channels</button><button>Events</button><button>Pipeline</button>
  <div class="gap"></div><button>Revenue</button><button>Spend &amp; ROI</button>
  <div class="gap"></div><button>Strategy &amp; Learning</button><button>Agents</button><button>Integrations</button>
  <select aria-label="Viewing as"><option>Founder</option><option>Head of GTM</option><option>SDR</option><option>Product</option></select>
</nav>
<main>
  <section class="sea" aria-label="Strategy course">
    <div class="bar"><input placeholder="Ask ONE anything  (Ctrl K)" aria-label="Ask ONE"><span>TraceLayer, last 90 days, synthetic demo data</span></div>
    <header id="head"><h1 id="title"></h1><p id="sub"></p></header>
    <div class="plot">
      <svg id="svg" viewBox="0 0 1200 300" role="group" aria-label="Course changes over 90 days. Use arrow keys or click a fix."></svg>
      <div id="read" aria-live="polite"></div>
    </div>
  </section>
  <section class="land">
    <div><h2 id="doh">Decide today</h2><ul id="list"></ul></div>
    <div class="src"><h2>Why the course changed</h2><ul id="why"></ul></div>
  </section>
</main>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo">Undo</button></div>
<script>
const W=[
 {x:60,y:230,wk:'Week 1',nm:'Funded startups',kind:'start',
  title:'Start with recently funded AI startups.',sub:'Funded startups reply fastest, so discovery leans on funding signals.',
  r:[['Qualified opp rate',null,'4.5%'],['Cost per qualified opp',null,'$310'],['Monthly pipeline',null,'$180k']],
  todo:[['Contact 40 funded startups','Funding announced in the last 30 days.']],
  why:[['HubSpot','14% reply rate from funded startups']]},
 {x:330,y:230,wk:'Week 2',nm:'Funding is not buying',kind:'bad',
  title:'Replies went up. Qualified deals did not.',sub:'Calls show the wrong timing and the wrong contact. Funding predicts replies, not purchases.',
  r:[['Qualified opp rate','4.5%','4.1%'],['Cost per qualified opp','$310','$334'],['Monthly pipeline','$180k','$172k']],
  todo:[['Cut funding-only priority','Funding correlates with replies, not qualified deals.'],['Find the real decision makers','Heads of Data sign at this size, not founders.']],
  why:[['Gong','38 calls mention timing or no budget owner'],['HubSpot','Replies up 31%, qualified opps down 9%']]},
 {x:590,y:160,wk:'Week 3',nm:'Launch plus hiring',kind:'good',
  title:'Launching AI while hiring GTM engineers converts 2.4 times better.',sub:'Two weak signals together beat one strong one. Discovery now looks for both.',
  r:[['Qualified opp rate','4.5%','7.2%'],['Cost per qualified opp','$310','$248'],['Monthly pipeline','$180k','$231k']],
  todo:[['Add the combined signal to discovery','A product launch and GTM hiring in the same month.']],
  why:[['Signals','64 opportunities compared across both segments'],['LinkedIn Jobs','GTM engineer roles at 41 matched accounts']]},
 {x:850,y:96,wk:'Week 4',nm:'Warm intros win',kind:'good',
  title:'Warm intros beat cold email for this segment.',sub:'One founders dinner opened 5 introduction paths. Intros book meetings at three times the cold rate.',
  r:[['Qualified opp rate','4.5%','9.6%'],['Cost per qualified opp','$310','$201'],['Monthly pipeline','$180k','$268k']],
  todo:[['Ask 5 dinner guests for introductions','AI Infrastructure Founders Dinner, 64 attendees.']],
  why:[['Luma','64 attendees, 21 already in the CRM'],['Gmail','19 intros this month, 6 before']]},
 {x:1140,y:70,wk:'Today',nm:'Today',kind:'now',
  title:'Your best buyers changed. Approve the new ICP test.',sub:'Companies launching production AI and hiring GTM engineers now lead. Confidence 0.78 on 64 opportunities, correlation not proof.',
  r:[['Qualified opp rate','4.5%','10.8%'],['Cost per qualified opp','$310','$185'],['Monthly pipeline','$180k','$294k']],
  todo:[['Test the revised ICP for 14 days','12 new accounts match.'],['Ask a customer to introduce RelayOps','Not ready for 60 days. Warm path exists.'],['Move $1,500 from paid ads to events','Paid ads take 40% of spend for 12.5% of qualified opps.']],
  why:[['Gong','Sales calls show timing and decision-maker gaps'],['Luma','Events produce the warmest paths'],['Google Ads','Lowest qualified return per dollar']]}
];
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg');
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
// depth contours: the chart's own texture, quiet
[[262,'#b7d5e7'],[286,'#9cc2d8']].forEach(([y,c])=>mk('path',{d:`M0 ${y} C 240 ${y-18}, 480 ${y+14}, 720 ${y-6} S 1080 ${y-20}, 1200 ${y-4}`,fill:'none',stroke:c,'stroke-width':1}));
W.forEach(p=>{const t=mk('text',{x:p.x,y:298,'text-anchor':p.kind==='now'?'end':'middle',class:'wk'});t.textContent=p.wk});
const course=mk('polyline',{id:'course',points:W.map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:'#c0187f','stroke-width':3.5,'stroke-linejoin':'round','stroke-linecap':'round'});
const L=course.getTotalLength();course.style.strokeDasharray=L;course.style.strokeDashoffset=L;
const col={start:'#c0187f',bad:'#c73a2b',good:'#23804a',now:'#c0187f'};
const fixes=W.map((p,i)=>{
  const g=mk('g',{class:'fix',tabindex:0,role:'button','aria-label':p.wk+', '+p.nm});
  mk('circle',{class:'hit',cx:p.x,cy:p.y,r:26},g);
  mk('circle',{class:'ring',cx:p.x,cy:p.y,r:9,stroke:col[p.kind]},g);
  mk('circle',{cx:p.x,cy:p.y,r:3,fill:col[p.kind]},g);
  const n=mk('text',{x:p.x,y:p.y-20,'text-anchor':p.kind==='now'?'end':'middle',class:'nm'},g);n.textContent=p.nm;
  g.onclick=()=>go(i);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i)}};
  return g});
const seg=i=>{let l=0;for(let k=1;k<=i;k++)l+=Math.hypot(W[k].x-W[k-1].x,W[k].y-W[k-1].y);return l};
let cur=-1;const done={};const $=id=>document.getElementById(id);
function render(i){
  const p=W[i];
  $('title').textContent=p.title;$('sub').textContent=p.sub;
  $('read').innerHTML='<p>'+p.wk+'</p>'+p.r.map(([l,b,a])=>'<div>'+l+'<b>'+(b?'<s>'+b+'</s>':'')+a+'</b></div>').join('');
  const rd=$('read'),left=p.x/1200*100,top=p.y/300*100;
  if(innerWidth>900){rd.style.left=(p.x>800?`calc(${left}% - 262px)`:`calc(${left}% + 22px)`);rd.style.top=(p.y>180?`calc(${top}% - 150px)`:`calc(${top}% + 18px)`)}
  $('doh').textContent=p.kind==='now'?'Decide today':'What ONE recommended in '+p.wk;
  $('list').innerHTML=p.todo.map(([a,b],k)=>{const id=i+'-'+k,d=done[id];return `<li class="${d?'done':''}"><span>${a}<em>${b}</em></span><button class="btn ${d?'ok':(k===0?'go':'')}" data-id="${id}">${d?'Approved':'Approve'}</button></li>`}).join('');
  $('why').innerHTML=p.why.map(([s,t])=>`<li><b>${s}</b> ${t}</li>`).join('');
}
function go(i,instant){
  if(i===cur)return;cur=i;
  course.style.strokeDashoffset=L-seg(i);
  fixes.forEach((g,k)=>{g.classList.toggle('on',k===i);g.classList.toggle('past',k<i)});
  if(instant){render(i);return}
  $('head').classList.add('out');$('read').classList.add('out');
  setTimeout(()=>{render(i);$('head').classList.remove('out');$('read').classList.remove('out')},180);
}
let last=null;const toast=$('toast');
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;done[id]=!done[id];last=id;render(cur);
  $('tmsg').textContent=done[id]?'Approved. Nothing is sent until the owner confirms.':'Approval removed.';
  toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),3200)};
$('undo').onclick=()=>{if(last){done[last]=!done[last];render(cur)}toast.classList.remove('show')};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'&&cur>0)go(cur-1);if(e.key==='ArrowRight'&&cur<W.length-1)go(cur+1)});
go(W.length-1,true);
</script>
</body></html>

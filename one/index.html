<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bearing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@1,500;1,600&display=swap">
<style>
/* World: a navigator's chart. Land (buff) rail, chart-water fields, magenta plotted course, black soundings for figures, fix marks at each course change. */
:root{
  --land:#ece2c4; --land-ink:#3d3622; --paper:#fdfdfb; --water:#d9eaf3; --water-deep:#b7d5e7; --contour:#9cc2d8;
  --ink:#121417; --muted:#4f5b66; --course:#c0187f; --fix-good:#23804a; --fix-bad:#c73a2b; --warn:#a86a00; --rule:#dfe4e8;
  --ui:'Barlow',system-ui,sans-serif; --chart:'Barlow Condensed','Barlow',sans-serif; --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font:16px/1.5 var(--ui);color:var(--ink);background:var(--paper);display:grid;grid-template-columns:196px minmax(0,1fr);font-variant-numeric:tabular-nums}
::selection{background:#f6c6e2;color:var(--ink)}
html{scrollbar-color:#c3ccd5 transparent}
nav{background:var(--land);color:var(--land-ink);padding:20px 12px;display:flex;flex-direction:column;gap:1px;font-size:15px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font:600 22px var(--ui);color:var(--ink);padding:0 12px 4px;letter-spacing:.02em}
nav .brand + small{font:italic 500 14px var(--chart);color:var(--land-ink);padding:0 12px 16px}
nav button{all:unset;padding:6px 12px;border-radius:6px;cursor:pointer;transition:background-color 150ms var(--ease)}
nav button:hover{background:#e2d6b2}
nav button[aria-current]{background:var(--ink);color:var(--land)}
nav button:focus-visible{outline:2px solid var(--course);outline-offset:2px}
nav .gap{height:12px}
nav select{margin-top:auto;font:inherit;padding:8px;border-radius:6px;border:1px solid #cdbf98;background:#f4ecd6;color:var(--ink);cursor:pointer}
main{min-width:0;position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 40px;background:var(--water);border-bottom:1px solid var(--contour)}
.bar input{width:340px;max-width:100%;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--contour);border-radius:6px;background:var(--paper);caret-color:var(--course)}
.bar input:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--course);outline-offset:2px}
.sync{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--fix-good);box-shadow:0 0 0 0 rgba(35,128,74,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(35,128,74,0)}100%{box-shadow:0 0 0 0 rgba(35,128,74,0)}}
#view{transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
#view.out{opacity:0;transform:translateY(6px)}
.page{padding:28px 40px 120px;max-width:1200px}
.page h1,h1{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.lede{color:var(--muted);margin:8px 0 24px;max-width:66ch}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:44px}
h2{font-size:17px;font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr{transition:background-color 400ms var(--ease)}
.tbl tbody tr:hover{background:#f6f9fb}
.btn{font:500 15px var(--ui);padding:7px 14px;border-radius:6px;border:1px solid #c9d1d8;background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform 140ms var(--ease),background-color 150ms var(--ease)}
.btn:hover{background:#f1f4f6}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--course);border-color:var(--course);color:#fff}
.btn.go:hover{background:#a5136c}
.btn.ok{background:#e4f2ea;border-color:#b5dcc4;color:var(--fix-good)}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:1px 8px;border-radius:4px;border:1px solid currentColor}
.tag.good{color:var(--fix-good)} .tag.bad{color:var(--fix-bad)} .tag.warn{color:var(--warn)} .tag.info{color:#1d5f8a}
.fixmark{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--course);position:relative;vertical-align:-2px}
.fixmark::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--course)}
.fixmark.good{border-color:var(--fix-good)}.fixmark.good::after{background:var(--fix-good)}
.fixmark.bad{border-color:var(--fix-bad)}.fixmark.bad::after{background:var(--fix-bad)}
.new{background:#fbe3f1 !important}
/* overview */
.sea{background:var(--water);position:relative;padding:8px 40px 8px;overflow:hidden}
#head{margin-top:20px;max-width:780px;transition:opacity 240ms var(--ease),filter 240ms var(--ease)}
#head.out,#read.out{opacity:0;filter:blur(4px)}
.ov h1{font-size:38px}
#sub{margin-top:8px;color:#2c3a46;max-width:62ch}
.plot{position:relative;margin-top:6px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot .wk{font:500 13px var(--ui);fill:var(--muted)}
.plot .nm{font:italic 600 17px var(--chart);fill:#1d3b52}
#course{transition:stroke-dashoffset 800ms var(--ease)}
.fix{cursor:pointer}.fix .hit{fill:transparent}
.fix .ring{fill:var(--water);stroke-width:2.5;transition:r 160ms var(--ease)}
.fix:hover .ring,.fix.on .ring{r:11}
.fix:focus{outline:none}.fix:focus-visible .ring{stroke:var(--ink)}
.fix .nm{opacity:.45;transition:opacity 200ms var(--ease)}
.fix.on .nm,.fix.past .nm{opacity:1}
.ghost{stroke:var(--course);stroke-width:2;stroke-dasharray:4 6;fill:none;opacity:.6}
#read{position:absolute;background:var(--paper);border:1px solid var(--contour);border-radius:4px;padding:10px 14px;box-shadow:0 6px 18px rgba(29,59,82,.14);min-width:236px;transition:opacity 240ms var(--ease),filter 240ms var(--ease),left 500ms var(--ease),top 500ms var(--ease)}
#read div{display:flex;justify-content:space-between;gap:18px;font-size:14px;color:var(--muted)}
#read b{color:var(--ink);font-weight:600;font-size:16px}
#read s{color:var(--muted);font-weight:400;margin-right:6px;font-size:14px}
#read p{font:italic 600 15px var(--chart);color:var(--course);margin-bottom:4px}
.land{padding:24px 40px 120px;display:grid;grid-template-columns:1.3fr 1fr;gap:48px}
ul.rows{padding:0}
ul.rows li{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:12px 0;border-top:1px solid var(--rule)}
ul.rows li span{font-weight:500}
ul.rows li em{display:block;font-style:normal;color:var(--muted);font-size:14px;font-weight:400}
ul.rows li.done span{color:var(--muted)}
ul.src li{list-style:none;font-size:15px;padding:10px 0;border-top:1px solid var(--rule)}
/* live log */
#log{position:fixed;right:20px;bottom:20px;width:340px;background:var(--paper);border:1px solid var(--contour);border-radius:8px;box-shadow:0 10px 30px rgba(29,59,82,.18);font-size:14px;z-index:5;transition:transform 260ms var(--ease)}
#log header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule);cursor:pointer;font-weight:600}
#log header span:last-child{margin-left:auto;color:var(--muted);font-weight:400}
#log ol{list-style:none;padding:0;max-height:220px;overflow:auto}
#log li{padding:8px 12px;border-bottom:1px solid var(--rule);animation:in 360ms var(--ease)}
#log li b{font:italic 600 15px var(--chart);margin-right:6px}
#log li.find b{color:var(--course)} #log li.warn b{color:var(--warn)} #log li.done b{color:var(--fix-good)}
#log.min ol{display:none}
@keyframes in{from{opacity:0;transform:translateY(-6px);filter:blur(3px)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;display:flex;gap:16px;transition:opacity 220ms var(--ease),transform 220ms var(--ease);pointer-events:none;z-index:6}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{all:unset;color:#f6a6d4;cursor:pointer;font-weight:600}
@media (max-width:900px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px}nav .gap,nav select,nav small{display:none}.bar,.page,.sea,.land{padding-left:16px;padding-right:16px}.grid2,.land{grid-template-columns:1fr}#read{position:static;margin:8px 0}#log{left:16px;right:16px;width:auto}.ov h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<nav aria-label="Workspaces">
  <div class="brand">Bearing</div><small>GTM that changes course</small>
  <button data-v="overview">Overview</button><button data-v="actions">Action Center</button>
  <div class="gap"></div><button data-v="discovery">Discovery</button><button data-v="icps">ICPs</button><button data-v="signals">Signals</button><button data-v="accounts">Accounts</button>
  <div class="gap"></div><button data-v="channels">Channels</button><button data-v="events">Events</button><button data-v="pipeline">Pipeline</button>
  <div class="gap"></div><button data-v="revenue">Meetings</button><button data-v="spend">Spend &amp; ROI</button>
  <div class="gap"></div><button data-v="strategy">Strategy &amp; Learning</button><button data-v="agents">Agents</button><button data-v="integrations">Integrations</button>
  <select id="role" aria-label="Viewing as"><option>Founder</option><option>Head of GTM</option><option>SDR</option><option>Product</option></select>
</nav>
<main>
  <div class="bar"><input id="ask" placeholder="Ask Bearing anything  (Ctrl K)" aria-label="Ask Bearing"><span class="sync"><i class="live" aria-hidden="true"></i><span id="sync">6 sources live</span><span>TraceLayer, synthetic demo data</span></span></div>
  <div id="view"></div>
</main>
<aside id="log" aria-label="Agent activity"><header><i class="live" aria-hidden="true"></i><span>Agents at work</span><span id="logn">14 agents</span></header><ol id="logl" aria-live="polite"></ol></aside>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo">Undo</button></div>
<script>
const ONE={views:{},view(id,v){this.views[id]=v}};window.ONE=ONE;
const $=id=>document.getElementById(id);
let timers=[],undoFn=null;
const ctx={
  toast(msg,undo){$('tmsg').textContent=msg;undoFn=undo||null;$('undo').hidden=!undo;const t=$('toast');t.classList.add('show');clearTimeout(t.t);t.t=setTimeout(()=>t.classList.remove('show'),3400)},
  feed(agent,text,kind){const li=document.createElement('li');li.className=kind||'find';li.innerHTML='<b>'+agent+'</b>'+text;$('logl').prepend(li);while($('logl').children.length>30)$('logl').lastChild.remove()},
  go(id){location.hash=id},
  every(ms,fn){timers.push(setInterval(fn,ms))}
};
$('undo').onclick=()=>{if(undoFn)undoFn();$('toast').classList.remove('show')};
$('log').querySelector('header').onclick=()=>$('log').classList.toggle('min');
function route(){
  const id=(location.hash.slice(1)||'overview');const v=ONE.views[id]||ONE.views.overview;
  timers.forEach(clearInterval);timers=[];
  document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===(ONE.views[id]?id:'overview')));
  const el=$('view');el.classList.add('out');
  setTimeout(()=>{el.innerHTML='';const box=document.createElement('div');el.appendChild(box);v.render(box,ctx);el.classList.remove('out');document.title='Bearing, '+v.title;scrollTo(0,0)},150);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ctx.go(b.dataset.v));
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('ask').focus()}});
$('ask').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){const q=e.target.value.toLowerCase();e.target.value='';
  const map=[['icp','icps'],['linkedin','channels'],['channel','channels'],['event','events'],['product','revenue'],['compet','signals'],['account','accounts'],['learn','strategy'],['agent','agents']];
  const hit=map.find(([k])=>q.includes(k));ctx.feed('Strategy Agent','Answered "'+q+'" with evidence from the '+(hit?hit[1]:'overview')+' workspace.','done');ctx.go(hit?hit[1]:'overview')}};
// global liveness: background agents keep working on every page
const BG=[['Signal Agent','RelayOps posted a second GTM engineer role.','find'],['Enrichment Agent','Merged 3 duplicate contacts from Luma and HubSpot.','done'],['Competitor Agent','Arize changed its pricing page toward enterprise.','warn'],['Revenue Agent','Call with Vellum Labs: Salesforce sync came up again.','warn'],['Discovery Agent','Found 2 accounts launching production agents this week.','find'],['Relationship Agent','New warm path to Kepler Ops via a dinner guest.','find'],['Evaluation Agent','Revised ICP test: day 6, qualified rate holding at 11.2%.','done'],['Market Agent','Search interest in agent evals up 18% month over month.','find'],['Event Agent','GTA 6 launched last week: drafted a gifting play for 12 tier A accounts.','find'],['Event Agent','Thanksgiving lunch: 9 local ICP founders likely free on Thursday.','find']];
let bi=0;setInterval(()=>{const [a,t,k]=BG[bi++%BG.length];ctx.feed(a,t,k)},4200);
const SY=['6 sources live','Syncing HubSpot','Syncing Gong','Syncing Luma','6 sources live'];let si=0;setInterval(()=>{$('sync').textContent=SY[si++%SY.length]},2600);
ctx.feed('Strategy Agent','Revised ICP ready for approval. Confidence 0.78.','find');ctx.feed('Signal Agent','17 high-priority signals since yesterday.','find');
// overview view
const W=[
 {x:60,y:230,wk:'Week 1',nm:'Funded startups',kind:'start',title:'Start with recently funded AI startups.',sub:'Funded startups reply fastest, so discovery leans on funding signals.',r:[['Qualified opp rate',null,'4.5%'],['Cost per qualified opp',null,'$310'],['Monthly pipeline',null,'$180k']],todo:[['Contact 40 funded startups','Funding announced in the last 30 days.']],why:[['HubSpot','14% reply rate from funded startups']]},
 {x:330,y:230,wk:'Week 2',nm:'Funding is not buying',kind:'bad',title:'Replies went up. Qualified deals did not.',sub:'Calls show the wrong timing and the wrong contact. Funding predicts replies, not purchases.',r:[['Qualified opp rate','4.5%','4.1%'],['Cost per qualified opp','$310','$334'],['Monthly pipeline','$180k','$172k']],todo:[['Cut funding-only priority','Funding correlates with replies, not qualified deals.'],['Find the real decision makers','Heads of Data sign at this size, not founders.']],why:[['Gong','38 calls mention timing or no budget owner'],['HubSpot','Replies up 31%, qualified opps down 9%']]},
 {x:590,y:160,wk:'Week 3',nm:'Launch plus hiring',kind:'good',title:'Launching AI while hiring GTM engineers converts 2.4 times better.',sub:'Two weak signals together beat one strong one. Discovery now looks for both.',r:[['Qualified opp rate','4.5%','7.2%'],['Cost per qualified opp','$310','$248'],['Monthly pipeline','$180k','$231k']],todo:[['Add the combined signal to discovery','A product launch and GTM hiring in the same month.']],why:[['Signals','64 opportunities compared across both segments'],['LinkedIn Jobs','GTM engineer roles at 41 matched accounts']]},
 {x:850,y:96,wk:'Week 4',nm:'Warm intros win',kind:'good',title:'Warm intros beat cold email for this segment.',sub:'One founders dinner opened 5 introduction paths. Intros book meetings at three times the cold rate.',r:[['Qualified opp rate','4.5%','9.6%'],['Cost per qualified opp','$310','$201'],['Monthly pipeline','$180k','$268k']],todo:[['Ask 5 dinner guests for introductions','AI Infrastructure Founders Dinner, 64 attendees.']],why:[['Luma','64 attendees, 21 already in the CRM'],['Gmail','19 intros this month, 6 before']]},
 {x:1110,y:70,wk:'Today',nm:'Today',kind:'now',title:'Your best buyers changed. Approve the new ICP test.',sub:'Companies launching production AI and hiring GTM engineers now lead. Confidence 0.78 on 64 opportunities, correlation not proof.',r:[['Qualified opp rate','4.5%','10.8%'],['Cost per qualified opp','$310','$185'],['Monthly pipeline','$180k','$294k']],todo:[['Test the revised ICP for 14 days','12 new accounts match.'],['Ask a customer to introduce RelayOps','Not ready for 60 days. Warm path exists.'],['Move $1,500 from paid ads to events','Paid ads take 40% of spend for 12.5% of qualified opps.']],why:[['Gong','Sales calls show timing and decision-maker gaps'],['Luma','Events produce the warmest paths'],['Google Ads','Lowest qualified return per dollar']],go:['icps','accounts','channels']}
];
const done={};let cur=-1;
ONE.view('overview',{title:'Overview',render(el,c){
  el.className='ov';
  el.innerHTML=`<section class="sea"><header id="head"><h1 id="title"></h1><p id="sub"></p></header><div class="plot"><svg id="svg" viewBox="0 0 1200 300" role="group" aria-label="Course changes over 90 days. Arrow keys or click a fix."></svg><div id="read" aria-live="polite"></div></div></section>
  <section class="land"><div><h2 id="doh"></h2><ul class="rows" id="list"></ul></div><div><h2>Why the course changed</h2><ul class="src" id="why"></ul></div></section>`;
  const NS='http://www.w3.org/2000/svg',svg=$('svg');
  const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
  [[262,'#b7d5e7'],[286,'#9cc2d8']].forEach(([y,col])=>mk('path',{d:`M0 ${y} C 240 ${y-18}, 480 ${y+14}, 720 ${y-6} S 1080 ${y-20}, 1200 ${y-4}`,fill:'none',stroke:col,'stroke-width':1}));
  W.forEach(p=>{const t=mk('text',{x:p.x,y:298,'text-anchor':p.kind==='now'?'end':'middle',class:'wk'});t.textContent=p.wk});
  mk('path',{class:'ghost',d:'M1110 70 L 1190 52'});
  const course=mk('polyline',{id:'course',points:W.map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:'#c0187f','stroke-width':3.5,'stroke-linejoin':'round','stroke-linecap':'round'});
  const L=course.getTotalLength();course.style.strokeDasharray=L;course.style.strokeDashoffset=L;
  const col={start:'#c0187f',bad:'#c73a2b',good:'#23804a',now:'#c0187f'};
  const fixes=W.map((p,i)=>{const g=mk('g',{class:'fix',tabindex:0,role:'button','aria-label':p.wk+', '+p.nm});
    mk('circle',{class:'hit',cx:p.x,cy:p.y,r:26},g);mk('circle',{class:'ring',cx:p.x,cy:p.y,r:9,stroke:col[p.kind]},g);mk('circle',{cx:p.x,cy:p.y,r:3,fill:col[p.kind]},g);
    const n=mk('text',{x:p.x,y:p.y-20,'text-anchor':p.kind==='now'?'end':'middle',class:'nm'},g);n.textContent=p.nm;
    g.onclick=()=>go(i);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i)}};return g});
  const seg=i=>{let l=0;for(let k=1;k<=i;k++)l+=Math.hypot(W[k].x-W[k-1].x,W[k].y-W[k-1].y);return l};
  function render(i){const p=W[i];$('title').textContent=p.title;$('sub').textContent=p.sub;
    $('read').innerHTML='<p>'+p.wk+'</p>'+p.r.map(([l,b,a])=>'<div>'+l+'<b>'+(b?'<s>'+b+'</s>':'')+a+'</b></div>').join('');
    const rd=$('read'),left=p.x/1200*100,top=p.y/300*100;
    if(innerWidth>900){rd.style.left=(p.x>800?`calc(${left}% - 262px)`:`calc(${left}% + 22px)`);rd.style.top=(p.y>180?`calc(${top}% - 150px)`:`calc(${top}% + 18px)`)}
    $('doh').textContent=p.kind==='now'?'Decide today':'What Bearing recommended in '+p.wk;
    $('list').innerHTML=p.todo.map(([a,b],k)=>{const id=i+'-'+k,d=done[id];return `<li class="${d?'done':''}"><span>${a}<em>${b}</em></span><button class="btn ${d?'ok':(k===0?'go':'')}" data-id="${id}">${d?'Approved':'Approve'}</button></li>`}).join('');
    $('why').innerHTML=p.why.map(([s,t],k)=>`<li><b>${s}</b> ${t}${p.go?` <button class="btn" style="padding:2px 10px;font-size:14px" data-go="${p.go[k]}">Open</button>`:''}</li>`).join('');}
  function go(i,instant){if(i===cur&&!instant)return;cur=i;course.style.strokeDashoffset=L-seg(i);
    fixes.forEach((g,k)=>{g.classList.toggle('on',k===i);g.classList.toggle('past',k<i)});
    if(instant){render(i);return}$('head').classList.add('out');$('read').classList.add('out');
    setTimeout(()=>{render(i);$('head').classList.remove('out');$('read').classList.remove('out')},180)}
  $('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;done[id]=!done[id];render(cur);
    if(done[id])c.feed('Strategy Agent','Approved: '+b.closest('li').querySelector('span').firstChild.textContent+'. Queued for the owner.','done');
    c.toast(done[id]?'Approved. Nothing is sent until the owner confirms.':'Approval removed.',()=>{done[id]=!done[id];render(cur)})};
  $('why').onclick=e=>{const b=e.target.closest('[data-go]');if(b)c.go(b.dataset.go)};
  el.onkeydown=null;c.every(10,()=>{});
  const kh=e=>{if(!document.body.contains(svg)){removeEventListener('keydown',kh);return}if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft'&&cur>0)go(cur-1);if(e.key==='ArrowRight'&&cur<W.length-1)go(cur+1)};
  addEventListener('keydown',kh);
  cur=-1;course.getBoundingClientRect();requestAnimationFrame(()=>{go(0,true);setTimeout(()=>go(W.length-1),250)});
}});
</script>
<script src="views/actions.js"></script><script src="views/signals.js"></script><script src="views/agents.js"></script>
<script src="views/icps.js"></script><script src="views/accounts.js"></script><script src="views/discovery.js"></script>
<script src="views/channels.js"></script><script src="views/events.js"></script><script src="views/integrations.js"></script><script src="views/more.js"></script>
<script>route();</script>
</body></html>
